/* ── Tema de factores CNA (igual que pmFactorTheme.ts) ─────────────────── */
const FACTOR_COLORS = { 1:"#0F385A", 2:"#4C6EF5", 3:"#2F9E44", 4:"#F08C00", 5:"#1FB2DE", 6:"#7048E8", 7:"#E64980", 8:"#12B886", 9:"#FA5252", 10:"#FBAF17", 11:"#A6CE38", 12:"#495057" };

const factorColor = (n) => (n != null && FACTOR_COLORS[n]) || "#64748B";

const fcv = (n) => `color-mix(in srgb, ${factorColor(n)}, white var(--lift))`;
const factorIcon = (n) => (n != null && FACTOR_ICONS[n]) || "landmark";
const parseFactorNum = (label) => { const m = /Factor\s+(\d+)/i.exec(label || ""); return m ? Number(m[1]) : null; };

const fkey = (label) => { const n = parseFactorNum(label); return n != null ? String(n) : label; };

function factorBadge(n, variant) {

/* ── Utilidades ────────────────────────────────────────────────────────── */
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const $ = (sel, root) => (root || document).querySelector(sel);

/** Número en formato colombiano (miles "." y decimales ","), igual que pmVariacion.ts. */
function fmtNumero(v, dec) {
  dec = dec || 0;
  const [entero, fraccion] = Math.abs(v).toFixed(dec).split(".");
  const miles = entero.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  const signo = v < 0 && Number(Math.abs(v).toFixed(dec)) !== 0 ? "-" : "";

}
function fmtValor(v, signo, decimales) {
  if (v == null) return "—";
  const dec = decimales ?? 1;
  if (signo === "ENT") return fmtNumero(v, 0);
  if (signo === "%FRAC") return fmtNumero(v * 100, dec) + "%";
  if (signo === "%") return fmtNumero(v, dec) + "%";

}
const fmtVariacion = (v) => (v == null ? "—" : (v > 0 ? "+" : "") + fmtNumero(v, 1) + "%");
const variacionClass = (v) => (v == null || Math.abs(v) < 0.05 ? "v-zero" : v > 0 ? "v-pos" : "v-neg");
/** Recta de mínimos cuadrados sobre los años cerrados (2026 es parcial y no cuenta); null después del cierre. */
function lineaTendencia(valores, anios) {
  const cerrado = (i) => anios[i] <= D.anio_cierre;
  const pts = [];
  valores.forEach((v, i) => { if (v != null && cerrado(i)) pts.push([i, v]); });
  if (pts.length < 2) return valores.map(() => null);
  const n = pts.length;
  const sx = pts.reduce((a, [x]) => a + x, 0), sy = pts.reduce((a, [, y]) => a + y, 0);
  const sxy = pts.reduce((a, [x, y]) => a + x * y, 0), sxx = pts.reduce((a, [x]) => a + x * x, 0);
  const den = n * sxx - sx * sx;
  const m = den === 0 ? 0 : (n * sxy - sx * sy) / den;
  const b = (sy - m * sx) / n;
  return valores.map((_, i) => (cerrado(i) ? b + m * i : null));
}
/** round() de Python (mitades al par): los % de los KPI deben coincidir con los del backend. */
function pyRound(x) { const f = Math.floor(x), d = x - f; return d < 0.5 ? f : d > 0.5 ? f + 1 : (f % 2 === 0 ? f : f + 1); }

const tendPill = (t, cls) => `<span class="pill ${cls || ""} t-${["Creciente", "Decreciente", "Estable"].includes(t) ? t : "none"}">${esc(t)}</span>`;

function sparkline(values, color, trend) {
  if (!values || values.length < 2) return '<span class="dim">—</span>';
  const W = 96, H = 28, min = Math.min(...values), max = Math.max(...values), range = max - min || 1;
  const step = W / (values.length - 1);
  const coords = values.map((v, i) => [i * step, H - ((v - min) / range) * H]);
  const pts = coords.map(([x, y]) => x.toFixed(2) + "," + y.toFixed(2)).join(" ");
  const [lx, ly] = coords[coords.length - 1];
  const dot = { Creciente: "var(--dot-up)", Decreciente: "var(--dot-down)", Estable: "var(--dot-flat)" }[trend] || "var(--dot-none)";
  const id = "sp" + (sparkline.n = (sparkline.n || 0) + 1);
  return `<svg width="${W}" height="${H}" style="overflow:visible" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" style="stop-color:${color}" stop-opacity=".35"/><stop offset="100%" style="stop-color:${color}" stop-opacity="0"/></linearGradient></defs><polygon points="0,${H} ${pts} ${W},${H}" fill="url(#${id})"/><polyline points="${pts}" fill="none" style="stroke:${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx.toFixed(2)}" cy="${ly.toFixed(2)}" r="2.5" style="fill:${dot}"/></svg>`;
}

function bullet(meta, ejec, metaFmt, ejecFmt, color) {
  if (meta == null && ejec == null) {
    return metaFmt !== "—" ? `<span style="font-size:11px;color:var(--muted)">Meta: ${esc(metaFmt)}</span>` : '<span class="dim">—</span>';
  }
  const scale = Math.max(meta ?? 0, ejec ?? 0, 1) * 1.15;
  const fill = ejec != null ? Math.min(100, (ejec / scale) * 100) : 0;
  const mk = meta != null ? Math.min(100, (meta / scale) * 100) : null;
  return `<div class="bullet"><div class="track"><div class="fill" style="width:${fill}%;background:${color}"></div>${mk != null ? `<div class="mark" style="left:${mk}%" title="Meta: ${esc(metaFmt)}"></div>` : ""}</div><div class="lbl"><span>Ejec ${esc(ejecFmt)}</span><span>Meta ${esc(metaFmt)}</span></div></div>`;
}

/* ── Selectores / paginación (HTML) ────────────────────────────────────── */
const opts = (arr, sel) => arr.map((o) => `<option value="${esc(o)}"${o === sel ? " selected" : ""}>${esc(o)}</option>`).join("");

}
function paginar(items, st) {
  const totalPages = Math.max(1, Math.ceil(items.length / st.pageSize));
  st.page = Math.min(st.page, totalPages - 1);
  return { totalPages, pageItems: items.slice(st.page * st.pageSize, (st.page + 1) * st.pageSize) };
}
function bindPager(root, st, rerender) {

  root.addEventListener("change", (e) => {
    if (e.target.dataset && e.target.dataset.act === "pagesize") { st.pageSize = Number(e.target.value); st.page = 0; rerender(); }

  guardarArchivo(xlsxBlob(hoja, [encabezado, ...datos]), st.subvista === "historico" ? "indicadores_cumplimiento.xlsx" : "indicadores_metas.xlsx");
}

function filasMetricas() {

          if (gAbierto) g.hojas.forEach((h) => { html += subFila(row, h.subindicador ?? "—", h, c, 2, { sub: g.nombre + " - " + h.subindicador, grp: "" }); });

function subFila(row, nombre, d, color, nivel, o) {

function clickMetrica(e) {
  const tg = e.target.closest("button[data-toggle]");
  if (tg) {
    const k = tg.dataset.toggle, ex = S.met.expandidos;
    ex.has(k) ? ex.delete(k) : ex.add(k);
    updateMetricas(true);
    return;
  }
  const tr = e.target.closest("tr[data-f]");
  if (tr) abrirMetrica(tr.dataset.f, tr.dataset.i, tr.dataset.sub || null, tr.dataset.grp || null);
}

/* ── Modal de métrica (ficha + gráfica) ────────────────────────────────── */
const TEND_COLORES = ["var(--tr0)", "var(--tr1)", "var(--tr2)"];
function abrirMetrica(factor, indicador, sub, grupo) {
  const d = D.met.detalles[[factor, indicador, sub || "", grupo || ""].join(SEP)];
  const subtitulo = grupo ? `Subtotal · ${grupo}` : sub && sub !== indicador ? sub : d && d.consolidado ? `Consolidado · ${(d.desglose || []).length} categorías${d.agregacion ? " · " + d.agregacion.toLowerCase() + " por año" : ""}` : "";
  const head = esc(indicador);
  if (!d) { abrirModal("w3", head, '<p class="muted">No se encontró información de la métrica.</p>', subtitulo); return; }

  const color = fcv(parseFactorNum(d.factor || factor));
  const fmtNum = (v) => fmtValor(v, d.signo ?? null, d.decimales ?? null);
  const variables = d.variables || [];
  const PALETA = [color, "var(--ser2)", "var(--ser3)"];
  const lineas = variables.length
    ? variables.map((v, i) => ({ clave: v.nombre, serie: v.serie, color: PALETA[i % PALETA.length] }))
    : [{ clave: "Resultado", serie: d.serie || [], color }];
  const anios = [...new Set(lineas.flatMap((l) => l.serie.map((p) => p.anio)))].sort((a, b) => a - b);
  const ajustes = lineas.map((l) => lineaTendencia(anios.map((a) => (l.serie.find((p) => p.anio === a) || {}).ejecucion ?? null), anios));
  const chartData = anios.map((a, i) => {
    const f = { anio: a };
    lineas.forEach((l, k) => {
      const p = l.serie.find((x) => x.anio === a);
      f[l.clave] = p?.ejecucion ?? null;
      f["Variación " + l.clave] = p?.variacion_pct ?? null;
      const aj = ajustes[k][i];
      f["Tendencia " + l.clave] = aj == null ? null : Math.round(aj * 100) / 100;
    });
    f.Meta = lineas.length === 1 ? (lineas[0].serie.find((x) => x.anio === a)?.meta ?? null) : null;
    return f;
  });
  const hayTend = ajustes.some((aj) => aj.some((v) => v != null));
  const hayMeta = chartData.some((p) => p.Meta != null);
  const desglose = d.desglose || [];
  const filasDesglose = d.grupos
    ? d.grupos.flatMap((g) => [{ grupo: true, nombre: g.nombre, serie: g.serie, tendencia: g.tendencia }, ...desglose.filter((c) => c.grupo === g.nombre).map((c) => ({ grupo: false, nombre: c.nombre ?? c.subindicador ?? "—", serie: c.serie, tendencia: c.tendencia }))])
    : desglose.map((c) => ({ grupo: false, nombre: c.nombre ?? c.subindicador ?? "—", serie: c.serie, tendencia: c.tendencia }));
  const aniosDes = [...new Set(desglose.flatMap((c) => c.serie.map((p) => p.anio)))].sort();
  const periodo = d.anio_inicio != null && d.anio_fin != null ? (d.anio_inicio === d.anio_fin ? String(d.anio_inicio) : `${d.anio_inicio} – ${d.anio_fin}`) : d.periodo_texto || "—";
  const etiqueta = d.consolidado && d.agregacion ? d.agregacion : "Resultado";
  const ficha = (label, inner, cls, sm) => `<div class="ficha"><p class="fl">${esc(label)}</p><div class="fv${sm ? " sm" : ""} ${cls || ""}">${inner}</div></div>`;

  let fichas;
  if (variables.length) {
    fichas = `<div class="fichas c3">${ficha("Periodo", esc(periodo), "", true)}${variables.map((v) => ficha(v.nombre + (v.ultimo_anio ? " " + v.ultimo_anio : ""), `${esc(v.valor_fmt)}<div class="fmeta"><span class="${variacionClass(v.variacion_ultima_pct)}">${fmtVariacion(v.variacion_ultima_pct)}</span>${tendPill(v.tendencia)}</div>`)).join("")}</div>`;
  } else {
    fichas = `<div class="fichas c5">${ficha("Periodo", esc(periodo), "", true)}${ficha(etiqueta + (d.ultimo_anio ? " " + d.ultimo_anio : ""), esc(d.valor_fmt))}${ficha("Variación último año", fmtVariacion(d.variacion_ultima_pct), variacionClass(d.variacion_ultima_pct))}${ficha("Variación promedio anual", fmtVariacion(d.variacion_promedio_pct), variacionClass(d.variacion_promedio_pct))}${ficha("Tendencia", tendPill(d.tendencia, "big"))}</div>`;
  }

  let tablaAnual = "";
  if (chartData.length) {
    const filasAnual = lineas.map((l) => `<tr><td style="font-weight:600">${esc(lineas.length > 1 ? l.clave : etiqueta)}</td>${chartData.map((p) => `<td style="font-weight:600">${fmtNum(p[l.clave])}</td>`).join("")}</tr><tr><td style="font-weight:600">${esc(lineas.length > 1 ? "Variación " + l.clave : "Variación")}</td>${chartData.map((p) => `<td class="${variacionClass(p["Variación " + l.clave])}" style="font-weight:500">${fmtVariacion(p["Variación " + l.clave])}</td>`).join("")}</tr>`).join("");
    const filaMeta = hayMeta ? `<tr><td style="font-weight:600">Meta</td>${chartData.map((p) => `<td>${fmtNum(p.Meta)}</td>`).join("")}</tr>` : "";
    tablaAnual = `<div class="mini sm x"><table><thead><tr><th>Año</th>${chartData.map((p) => `<th>${p.anio}</th>`).join("")}</tr></thead><tbody>${filasAnual}${filaMeta}</tbody></table></div>`;
  }
  let tablaDes = "";
  if (desglose.length) {
    tablaDes = `<div><p class="lbl-b" style="margin-bottom:8px">Desglose por categoría</p><div class="mini sm x"><table><thead><tr><th>Categoría</th>${aniosDes.map((a) => `<th>${a}</th>`).join("")}<th class="tl">Tendencia</th></tr></thead><tbody>${filasDesglose.map((c) => `<tr${c.grupo ? ' class="g"' : ""}><td class="nm2 ${c.grupo ? "" : d.grupos ? "ind" : ""}" style="${c.grupo ? "font-weight:600" : d.grupos ? "" : "font-weight:500"}">${esc(c.nombre)}</td>${aniosDes.map((a) => `<td>${fmtNum((c.serie.find((p) => p.anio === a) || {}).ejecucion)}</td>`).join("")}<td class="tl">${tendPill(c.tendencia)}</td></tr>`).join("")}</tbody></table></div></div>`;
  }

  abrirModal("w3", head, `
    <div style="display:flex;align-items:center;gap:8px">${factorBadge(parseFactorNum(d.factor), "full")}<span class="hint" style="font-weight:600">${esc(d.factor)}</span></div>
    ${fichas}
    ${chartData.length ? '<div class="chart-wrap" id="chart"></div>' : '<p class="muted">Sin serie histórica registrada.</p>'}
    ${tablaAnual}${tablaDes}
    <div class="cols2"><div><p class="lbl-b">Fuente</p><p class="txt">${esc(d.fuente)}</p></div><div><p class="lbl-b">Periodicidad</p><p class="txt">${esc(d.periodicidad)}</p></div></div>`, subtitulo);

  if (chartData.length) {
    const series = lineas.map((l) => ({ clave: l.clave, nombre: l.clave, color: l.color, ancho: 2.5, dash: null, puntos: true, etiquetas: true }));
    if (hayTend) lineas.forEach((l, k) => series.push({ clave: "Tendencia " + l.clave, nombre: lineas.length > 1 ? "Tendencia " + l.clave : "Tendencia (lineal)", color: TEND_COLORES[k % TEND_COLORES.length], ancho: 2, dash: "6 4", puntos: false, etiquetas: false, recta: true }));
    if (hayMeta) series.push({ clave: "Meta", nombre: "Meta", color: "var(--meta)", ancho: 1.5, dash: "4 4", puntos: false, etiquetas: false });
    const dibujar = () => lineChart($("#chart"), chartData, series, fmtNum);
    dibujar();
    modalResize = dibujar;
  }
}

/* ── Gráfico de líneas SVG (equivalente al LineChart de recharts) ──────── */
function niceMax(max) {
  if (max <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log10(max))), f = max / exp;
  const nice = f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10;
  return nice * exp;
}
function lineChart(el, data, series, fmt) {
  if (!el) return;
  const W = el.clientWidth || 640, H = el.clientHeight || 288;
  const vals = series.flatMap((s) => data.map((r) => r[s.clave])).filter((v) => v != null);
  const yMax = niceMax(Math.max(...vals, 0)), ticks = [0, 1, 2, 3, 4].map((i) => (yMax / 4) * i);
  const labW = Math.max(...ticks.map((t) => fmt(t).length)) * 6.5 + 12;
  const m = { top: 22, right: 24, left: Math.max(40, labW), bottom: 36 };
  const iw = W - m.left - m.right, ih = H - m.top - m.bottom;
  const x = (i) => m.left + (data.length === 1 ? iw / 2 : (iw / (data.length - 1)) * i);
  const y = (v) => m.top + ih - (Math.max(0, v) / yMax) * ih;
  let g = "";
  ticks.forEach((t) => { g += `<line class="ch-grid" x1="${m.left}" x2="${W - m.right}" y1="${y(t)}" y2="${y(t)}"/><text class="ch-tick" x="${m.left - 8}" y="${y(t) + 4}" text-anchor="end">${esc(fmt(t))}</text>`; });
  data.forEach((r, i) => { g += `<text class="ch-tick" x="${x(i)}" y="${m.top + ih + 18}" text-anchor="middle">${r.anio}</text>`; });
  g += `<line class="ch-axis" x1="${m.left}" x2="${W - m.right}" y1="${m.top + ih}" y2="${m.top + ih}"/>`;
  series.forEach((s) => {
    // Cada segmento continuo (connectNulls: se saltan los huecos y se unen los puntos con dato).
    const pts = data.map((r, i) => (r[s.clave] == null ? null : [x(i), y(r[s.clave]), r[s.clave]])).filter(Boolean);
    if (!pts.length) return;
    g += `<path d="${pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ")}" fill="none" style="stroke:${s.color}" stroke-width="${s.ancho}"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
    if (s.puntos) pts.forEach((p) => { g += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" style="fill:${s.color}"/>`; });
    if (s.etiquetas) pts.forEach((p) => { g += `<text class="ch-lab" x="${p[0].toFixed(1)}" y="${(p[1] - 9).toFixed(1)}" text-anchor="middle">${esc(fmt(p[2]))}</text>`; });
  });
  // Leyenda inferior
  const ley = series.map((s) => ({ s, w: s.nombre.length * 6 + 34 }));
  const total = ley.reduce((a, l) => a + l.w, 0);
  let lx = Math.max(m.left, (W - total) / 2);
  ley.forEach(({ s, w }) => { g += `<line x1="${lx}" x2="${lx + 14}" y1="${H - 8}" y2="${H - 8}" style="stroke:${s.color}" stroke-width="2"${s.dash ? ` stroke-dasharray="${s.dash}"` : ""}/><text class="ch-leg" x="${lx + 19}" y="${H - 4}">${esc(s.nombre)}</text>`; lx += w; });
  g += `<line id="cursor" x1="0" x2="0" y1="${m.top}" y2="${m.top + ih}" class="ch-cur" visibility="hidden"/>`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg><div class="tip hidden" id="tip"></div>`;
  const svg = el.firstChild, tip = $("#tip", el), cur = $("#cursor", el);
  svg.addEventListener("mousemove", (e) => {
    const r = svg.getBoundingClientRect(), px = e.clientX - r.left;
    let idx = 0, best = Infinity;
    data.forEach((_, i) => { const dd = Math.abs(x(i) - px); if (dd < best) { best = dd; idx = i; } });
    cur.setAttribute("x1", x(idx)); cur.setAttribute("x2", x(idx)); cur.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="th">${data[idx].anio}</div>` + series.map((s) => (data[idx][s.clave] == null ? "" : `<div class="tr"><span class="sw" style="background:${s.color}"></span>${esc(s.nombre)}: ${esc(fmt(data[idx][s.clave]))}</div>`)).join("");
    tip.classList.remove("hidden");
    const left = x(idx) + 12 + tip.offsetWidth > W ? x(idx) - 12 - tip.offsetWidth : x(idx) + 12;
    tip.style.left = Math.max(0, left) + "px"; tip.style.top = m.top + "px";
  });
  svg.addEventListener("mouseleave", () => { tip.classList.add("hidden"); cur.setAttribute("visibility", "hidden"); });
}

/* ── Modal genérico ────────────────────────────────────────────────────── */
let modalResize = null;
function abrirModal(ancho, titulo, cuerpo, subtitulo) {
  cerrarModal();
  $("#modal-root").innerHTML = `<div class="overlay" id="overlay"><div class="modal ${ancho}" role="dialog" aria-modal="true"><div class="modal-head"><div><h3>${titulo}</h3>${subtitulo ? `<p class="hint">${esc(subtitulo)}</p>` : ""}</div><button type="button" class="close" aria-label="Cerrar">✕</button></div><div class="modal-body">${cuerpo}</div></div></div>`;
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay" || e.target.closest(".close")) cerrarModal(); });
}
function cerrarModal() { $("#modal-root").innerHTML = ""; modalResize = null; }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") cerrarModal(); });
window.addEventListener("resize", () => { if (modalResize) modalResize(); });

/* ── Exportación a .xlsx (sin librerías: zip "store" + XML mínimo) ─────── */
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  const u16 = (n) => [n & 255, (n >>> 8) & 255], u32 = (n) => [n & 255, (n >>> 8) & 255, (n >>> 16) & 255, (n >>> 24) & 255];
  for (const f of files) {
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const local = new Uint8Array([...u32(0x04034b50), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...name]);
    parts.push(local, data);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset), ...name]));
    offset += local.length + data.length;
  }
  const cdSize = central.reduce((a, c) => a + c.length, 0);
  const fin = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, fin], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xlsxBlob(hoja, filas) {
  const col = (i) => { let s = ""; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + ((i - 1) % 26)) + s; return s; };
  const x = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])).replace(/[\x00-\x08\x0b\x0c\x0e-\x1f]/g, "");
  const rows = filas.map((fila, r) => `<row r="${r + 1}">${fila.map((v, c) => (v == null || v === "" ? "" : typeof v === "number" ? `<c r="${col(c)}${r + 1}"><v>${v}</v></c>` : `<c r="${col(c)}${r + 1}" t="inlineStr"><is><t xml:space="preserve">${x(v)}</t></is></c>`)).join("")}</row>`).join("");
  const H = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
  return zipStore([
    { name: "[Content_Types].xml", data: H + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>' },
    { name: "_rels/.rels", data: H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: "xl/workbook.xml", data: H + `<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${x(hoja)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", data: H + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>' },
    { name: "xl/worksheets/sheet1.xml", data: H + `<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows}</sheetData></worksheet>` },
  ]);
}
function descargar(blob, nombre) {
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

mountApp();
