[project]
name = "Indicadores_Oportunidad_Mejora"

# ── Reglas de negocio ─────────────────────────────────────────────
# Editar aqui cada año. NO editar código Python.
[business]
"año_cierre"    = 2026
ids_plan_anual   = ["373","390","414","415","416","417","418","420","469","470","471"]
ids_tope_100     = ["208","218","92","104","106","124","125","126","127","128","272"]
# Indicadores 'Tipo 2 / Desglose Variables' con formato % cuya fórmula es un cociente ×100: el catálogo
# guardaba como Meta/Ejecución los CONTEOS de las variables (p. ej. 69: 1.249 y 1.137 con unidad %).
# Se toman directamente del API (meta % y resultado %), igual que los 'Tipo 1'.
ids_desglose_var_directo = ["69","88","91","235","282","344","397","426","86"]
# IDs que NO deben excluirse aunque no estén en el catálogo Kawak del año
ids_siempre_validos = []

[paths]
base_dir = "."
data_raw = "data/raw"
data_output = "data/output"

# Fuentes principales
input_fuente_consolidado = "data/raw/Resultados_Consolidados_Fuente.xlsx"
kawak_dir = "data/raw/Kawak"
api_dir = "data/raw/API"
fuentes_consolidadas_dir = "data/raw/Fuentes Consolidadas"

# Artefactos esperados
out_resultados_consolidados = "data/output/Resultados Consolidados.xlsx"
out_seguimiento_reporte = "data/output/Seguimiento_Reporte.xlsx"

# Archivos generados por consolidar_api.py
out_kawak_catalogo = "data/raw/Fuentes Consolidadas/Indicadores Kawak.xlsx"
out_api_consolidado = "data/raw/Fuentes Consolidadas/Consolidado_API_Kawak.xlsx"

[pipeline]
# Orden de ejecucion del pipeline.
# "sincronizar_directorio_indicadores" agrega al directorio maestro los indicadores
# nuevos de Kawak/API y a la hoja de cada PDI activo, y solicita su asignacion de
# linea/objetivo/meta (en CI queda pendiente y emite [AVISO]); va despues de
# consolidar_api y antes de actualizar_directorio_maestro.
# "actualizar_directorio_maestro" complementa Periodicidad/Sentido/Clasificacion
# del directorio maestro (data/raw/Catalogo de Indicadores.xlsx) usando
# Ficha_Tecnica_Indicadores.xlsx y, si esta presente, data/raw/Indicadores por
# CMI.xlsx (copiado desde Sistema_Indicadores_Poli por el workflow de CI).
# "cna_extraction" regenera data/output/Resultados_Consolidados_CNA.xlsx.
# "generar_seguimiento" regenera data/output/Seguimiento_Reporte.xlsx desde los archivos
# anuales de Kawak + el consolidado de la API (el LMI ya no se usa). Va despues de
# actualizar_consolidado porque las hojas de cierres leen Resultados Consolidados.xlsx.
# Nota: scripts/plan_mejoramiento/build_catalogo_indicadores.py NO esta en esta
# lista a proposito -- solo se ejecuta manualmente (ver comentario en
# scripts/run_pipeline.py).
steps = [
  "consolidar_api",
  "sincronizar_directorio_indicadores",
  "actualizar_directorio_maestro",
  "cna_extraction",
  "actualizar_consolidado",
  "generar_seguimiento",
  "generar_reporte",
]

[run]
# Carpeta donde se guardan reportes y logs del pipeline
artifacts_dir = "artifacts"

[checks]
# Validaciones basicas post-ejecucion (sin dependencias extra)
strict_data_contracts = true
required_outputs = [
  "data/raw/Fuentes Consolidadas/Indicadores Kawak.xlsx",
  "data/raw/Fuentes Consolidadas/Consolidado_API_Kawak.xlsx",
  "data/output/Resultados Consolidados.xlsx",
  "data/output/Seguimiento_Reporte.xlsx",
]

# Hojas que se esperan en los excels principales
resultados_consolidados_required_sheets = [
  "Consolidado Historico",
  "Consolidado Semestral",
  "Consolidado Cierres",
  "Catalogo Indicadores",
]

seguimiento_reporte_required_sheets = [
  "Tracking Mensual",
]

# ── Agente Claude ────────────────────────────────────────────────────
[agent]
# Modelo Claude a usar para diagnóstico de fallos
model = "claude-opus-4-6"
# Máximo de tokens en la respuesta del agente
max_tokens = 2048
# Máximo de caracteres de logs enviados al agente
max_log_chars = 12000
# Si True, el agente intenta sugerir y aplicar hotfixes simples
enable_hotfix = false

# ── Programación automática ──────────────────────────────────────────
# Consumido por .github/workflows/actualizar-datos.yml. GitHub Actions no
# permite leer el cron dinamicamente desde este archivo (el valor en
# on.schedule del workflow debe ser literal) — si cambias el valor aqui,
# actualiza tambien el workflow a mano.
[schedule]
# Expresión cron (GitHub Actions, en UTC): día 10 de cada mes a las 11:00 UTC
# = 06:00 hora Colombia (UTC-5), horario laboral para poder reaccionar si falla.
# Día 10 (no 5): las fuentes de Kawak y la API se actualizan en los primeros días del mes
# (en octubre de 2026, el día 7); a las 06:00 del día 5 el pipeline procesaba el mes anterior.
cron = "0 11 10 * *"
# Rama donde se hace commit de resultados
branch = "main"
# Archivos a incluir en el commit automático
commit_paths = [
  "data/output/",
  "data/raw/Fuentes Consolidadas/",
  "data/raw/Catalogo de Indicadores.xlsx",
  "data/raw/Indicadores por CMI.xlsx",
  "artifacts/",
]
commit_message = "chore(data): actualizar consolidado automático [{date}]"
