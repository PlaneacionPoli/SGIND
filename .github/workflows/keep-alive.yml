name: Keep backend awake

on:
  schedule:
    # Cada 10 min — Render (free tier) duerme el servicio tras 15 min sin trafico
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://sgind-v2-backend.onrender.com/api/v1/health)
          echo "Backend health status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::El backend respondio con status $status"
          fi
