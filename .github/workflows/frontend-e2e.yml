name: Frontend (tsc, unit, E2E)

# Los tests E2E mockean la API con page.route() (frontend/e2e/fixtures.ts):
# no necesitan backend ni PostgreSQL, solo el frontend compilado.
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-e2e.yml"
  workflow_dispatch:

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      # NEXT_PUBLIC_* se incrustan en el build: los tests de login esperan el
      # "Acceso de desarrollo", que en `next start` solo existe con esta bandera.
      NEXT_PUBLIC_ENABLE_DEV_LOGIN: "true"
      NEXT_PUBLIC_ENABLE_DIAGNOSTICS: "true"
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Tests unitarios (Vitest)
        run: npm run test:unit

      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      # playwright.config.ts levanta `npm run build && npm run start` cuando CI=true
      - name: Tests E2E (Playwright)
        run: npx playwright test
        env:
          CI: "true"

      - name: Subir reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
